name: 世界分身每日日報

on:
  schedule:
    # 每日香港時間 08:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動觸發測試

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 運行世界收集器
        run: python havrebot_world_collector.py

      - name: 提交日報
        run: |
          git config user.name "havreBOT World Twin"
          git config user.email "world-twin@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "無新日報，跳過提交" || git commit -m "📰 世界分身日報 $(date +%Y-%m-%d)"
          git push
